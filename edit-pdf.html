<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit PDF Online - Add White Box & Text</title>
    <meta name="description" content="Free online tool to edit PDF by hiding old text and writing new text. 100% private.">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        .pdf-editor-box { background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; margin: 20px auto; }
        .form-group { margin-bottom: 15px; }
        .form-group label { font-weight: bold; display: block; margin-bottom: 8px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }
        .btn-action { background: #e53e3e; color: white; border: none; padding: 12px 20px; border-radius: 5px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-action:disabled { background: #feb2b2; cursor: not-allowed; }
        .status { text-align: center; font-weight: bold; margin-top: 15px; color: #28a745; display: none; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">📸 Photo Resizer</h1>
            <nav class="nav">
                <a href="index">🏠 Home</a>
                <a href="india">🇮🇳 India</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="intro-section" style="text-align: center; margin-top: 30px;">
            <h2>📝 Edit PDF Online (Erase & Write)</h2>
            <p>Hide old text with a white box and write new text. 100% private.</p>
        </section>

        <div class="pdf-editor-box">
            <div class="form-group">
                <label>1. Select PDF File</label>
                <input type="file" id="pdfFileInput" accept="application/pdf">
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Where is the old text?</label>
                    <select id="erasePosition">
                        <option value="none">Don't Erase (Just Add Text)</option>
                        <option value="top-left">Top Left (Erase)</option>
                        <option value="top-center">Top Center (Erase)</option>
                        <option value="center">Center (Erase)</option>
                        <option value="bottom-center">Bottom Center (Erase)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>White Box Size</label>
                    <select id="eraseSize">
                        <option value="1">Small</option>
                        <option value="2">Medium</option>
                        <option value="3">Large</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>2. Enter New Text (Date, Name, etc.)</label>
                <input type="text" id="newText" placeholder="e.g., 26/10/2026" required>
            </div>

            <div class="form-group">
                <label>Text Color</label>
                <select id="textColor">
                    <option value="black" selected>Black</option>
                    <option value="blue">Blue</option>
                    <option value="red">Red</option>
                </select>
            </div>

            <button class="btn-action" id="editPdfBtn" disabled>⚡ Edit PDF & Download</button>
            <div class="status" id="statusMsg">✅ PDF Edited Successfully!</div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 Photo Resizer | Made for the World 🌍</p>
        </div>
    </footer>

    <script>
        const pdfFileInput = document.getElementById('pdfFileInput');
        const editPdfBtn = document.getElementById('editPdfBtn');
        const statusMsg = document.getElementById('statusMsg');

        let pdfFile = null;

        pdfFileInput.addEventListener('change', (e) => {
            pdfFile = e.target.files[0];
            if (pdfFile) editPdfBtn.disabled = false;
        });

        editPdfBtn.addEventListener('click', async () => {
            if (!pdfFile) return alert("Please select a PDF file.");
            
            const newText = document.getElementById('newText').value;
            if (!newText) return alert("Please enter some text to add.");

            editPdfBtn.innerText = "Processing... Please wait";
            editPdfBtn.disabled = true;
            statusMsg.style.display = 'none';

            try {
                const pdfBytes = await pdfFile.arrayBuffer();
                const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
                const pages = pdfDoc.getPages();
                const firstPage = pages[0];
                const { width, height } = firstPage.getSize();

                const font = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
                
                // Text Color
                const colorValue = document.getElementById('textColor').value;
                let color;
                if (colorValue === 'blue') color = PDFLib.rgb(0, 0, 1);
                else if (colorValue === 'red') color = PDFLib.rgb(1, 0, 0);
                else color = PDFLib.rgb(0, 0, 0);

                // Erase (White Box) Logic
                const erasePos = document.getElementById('erasePosition').value;
                const eraseMultiplier = parseFloat(document.getElementById('eraseSize').value);
                
                let boxW = width * 0.4 * eraseMultiplier; // 40% width
                let boxH = height * 0.1 * eraseMultiplier; // 10% height
                let boxX = 0;
                let boxY = 0;
                let drawBox = true;

                if (erasePos === 'top-left') {
                    boxX = 50; boxY = height - boxH - 50;
                } else if (erasePos === 'top-center') {
                    boxX = (width - boxW) / 2; boxY = height - boxH - 50;
                } else if (erasePos === 'center') {
                    boxX = (width - boxW) / 2; boxY = (height - boxH) / 2;
                } else if (erasePos === 'bottom-center') {
                    boxX = (width - boxW) / 2; boxY = 50;
                } else {
                    drawBox = false;
                }

                // Draw White Box (Erase)
                if (drawBox) {
                    firstPage.drawRectangle({
                        x: boxX,
                        y: boxY,
                        width: boxW,
                        height: boxH,
                        color: PDFLib.rgb(1, 1, 1), // Pure White
                        borderWidth: 0
                    });
                }

                // Draw New Text (Slightly above the erased box)
                let textX = drawBox ? boxX + 10 : 50;
                let textY = drawBox ? boxY + (boxH / 2) - 5 : 50;

                firstPage.drawText(newText, {
                    x: textX,
                    y: textY,
                    size: 16,
                    font: font,
                    color: color,
                });

                const modifiedPdfBytes = await pdfDoc.save();
                const blob = new Blob([modifiedPdfBytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = 'Edited_Document.pdf';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                statusMsg.style.display = 'block';
                editPdfBtn.innerText = "⚡ Edit PDF & Download";
                editPdfBtn.disabled = false;

            } catch (error) {
                console.error(error);
                alert("Error processing PDF.");
                editPdfBtn.innerText = "⚡ Edit PDF & Download";
                editPdfBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
