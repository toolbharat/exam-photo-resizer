<main class="container">
        <section class="intro-section" style="text-align: center; margin-top: 30px;">
            <h1 style="font-size: 28px; color: #1e293b; margin-bottom: 8px;">Flip a Coin</h1>
            <p style="color: #64748b; margin-bottom: 10px;">Click the coin or the button below to flip!</p>
        </section>

        <div class="tool-container">
            <div class="coin-container" onclick="flipCoin()">
                <div class="coin" id="coin">
                    <div class="side heads">&#x1F451;</div>
                    <div class="side tails">&#x1F31F;</div>
                </div>
            </div>
            
            <div class="result-text" id="result">Heads or Tails?</div>
            
            <button class="action-btn" id="flipBtn" onclick="flipCoin()">Flip Coin</button>
        </div>
    </main>

    <script>
        let isFlipping = false;
        let currentRotation = 0;

        function flipCoin() {
            if (isFlipping) return;
            isFlipping = true;
            
            const coin = document.getElementById('coin');
            const resultText = document.getElementById('result');
            const btn = document.getElementById('flipBtn');
            
            btn.disabled = true;
            resultText.innerText = "Flipping...";

            // Randomly decide heads (0) or tails (1)
            const isHeads = Math.random() < 0.5;
            
            // Calculate new rotation (add at least 3 full spins = 1080 degrees)
            // If Heads: land on 0, 360, 720, etc.
            // If Tails: land on 180, 540, 900, etc.
            const spins = 5; // Number of spins
            if (isHeads) {
                currentRotation += 360 * spins;
            } else {
                currentRotation += 360 * spins + 180;
            }

            // Apply rotation
            coin.style.transform = `rotateY(${currentRotation}deg)`;

            // Wait for animation to finish
            setTimeout(() => {
                resultText.innerText = isHeads ? "Heads!" : "Tails!";
                btn.disabled = false;
                isFlipping = false;
            }, 1000); // Matches CSS transition time
        }
    </script>
